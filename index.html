            border-radius: 10px;
            position: relative;
        }
        .ico-action{
            height: 80px;
            position: absolute;

        }

        .next{

        }

        .back{



        }

</head>

    <div class = "container">
        <img src="img/img1.avif" class="images">
        <img src="img/next-icon.png" class="next ico-action">
        <img src="img/back-icon.png" class="back ico-action">
    </div>
</body>
</html>
